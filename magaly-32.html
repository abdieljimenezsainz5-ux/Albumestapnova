<!-- =====================================================================
     PLANTILLA DE CUMPLEAÑOS
     Para un cumpleaños nuevo:
       1) Copia este archivo y ponle el nombre de la fiesta, sin espacios
          ni acentos:  camila-30.html
       2) Cambia SOLO lo que está entre comillas, aquí abajo.
       3) Súbelo a GitHub. El enlace será:  tu-sitio.netlify.app/camila-30.html  (con .html al final)

     Reglas:
       · No uses comillas dobles (") dentro de los textos.
       · data-evento: solo letras minúsculas, números y guiones. Debe ser
         DIFERENTE en cada cumpleaños (así no se mezclan las fotos).
       · Si no quieres algo, déjalo vacío: data-edad=""
     ===================================================================== -->
